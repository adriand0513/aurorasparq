<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're on Premium | Aurora Sparq</title>
  <meta name="theme-color" content="#1a1020" />
  <link rel="stylesheet" href="/static/css/base.css" />
  <style>
    body {
      min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 24px; padding: 32px 16px; text-align: center;
      background: radial-gradient(60% 40% at 50% 0%, rgba(238, 154, 98, 0.12), transparent 70%), var(--night);
    }
    .face {
      width: 96px; height: 96px; border-radius: 50%; margin: 0 auto 20px;
      background: url("/static/images/isabella.png") 40% 12% / 175% auto no-repeat, var(--velvet);
      box-shadow: 0 0 0 3px var(--night), 0 0 0 4px rgba(238, 154, 98, 0.7);
    }
    h1 {
      font-family: var(--font-display); font-weight: 500;
      font-size: clamp(2.2rem, 7vw, 3rem); line-height: 1.08; margin: 0 0 12px;
    }
    p { color: var(--smoke); margin: 0 auto 28px; max-width: 30em; }
    .redirect { margin: 18px 0 0; font-size: 0.9rem; }
  </style>
</head>
<body>
  <a class="wordmark" href="/">Aurora Sparq</a>
  <main>
    <div class="face" aria-hidden="true"></div>
    <h1>You're on Premium</h1>
    <p>No more daily limit, and Isabella can send you voice notes now. It may take a few seconds for your plan to update.</p>
    <a class="btn btn-primary" href="/chat?upgraded=1">Back to Isabella</a>
    <p class="redirect" aria-live="polite">Taking you back in <span id="countdown">6</span> seconds.</p>
  </main>
  <script>
    (function () {
      var left = 6;
      var el = document.getElementById('countdown');
      var timer = setInterval(function () {
        left -= 1;
        el.textContent = left;
        if (left <= 0) {
          clearInterval(timer);
          window.location.href = '/chat?upgraded=1';
        }
      }, 1000);
    })();
  </script>
</body>
</html>
