<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aurora Sparq • Isabella</title>
    <style>
        :root {
            --bg: #07010f;
            --bg-elevated: rgba(22, 10, 40, 0.82);
            --bg-bubble-her: rgba(42, 24, 72, 0.92);
            --bg-bubble-him: linear-gradient(135deg, #c300ff 0%, #ff0099 100%);
            --accent: #c300ff;
            --accent2: #ff0099;
            --accent-soft: rgba(195, 0, 255, 0.18);
            --text: #f6edff;
            --text-muted: rgba(246, 237, 255, 0.62);
            --border: rgba(195, 0, 255, 0.22);
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
            --radius: 16px;
            --radius-sm: 12px;
            --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
    
        * { margin: 0; padding: 0; box-sizing: border-box; }
    
        body {
            background:
                radial-gradient(1200px 600px at 10% -10%, rgba(195, 0, 255, 0.18), transparent 55%),
                radial-gradient(900px 500px at 100% 0%, rgba(255, 0, 153, 0.12), transparent 50%),
                radial-gradient(800px 700px at 50% 120%, rgba(80, 20, 140, 0.25), transparent 55%),
                var(--bg);
            color: var(--text);
            font-family: var(--font);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }
    
        /* ========== HEADER ========== */
        .header {
            padding: 12px 16px;
            background: rgba(12, 4, 24, 0.78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
            z-index: 20;
        }
    
        .avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: url('/static/images/isabella.png') center/cover;
            border: 2px solid rgba(195, 0, 255, 0.7);
            box-shadow: 0 0 0 3px rgba(195, 0, 255, 0.12), 0 0 20px rgba(195, 0, 255, 0.25);
            flex-shrink: 0;
        }
    
        .header-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            flex: 1;
        }
    
        .header-name {
            font-size: 1.08rem;
            font-weight: 650;
            letter-spacing: 0.01em;
            color: var(--text);
            line-height: 1.15;
        }
    
        .header-status {
            font-size: 0.75rem;
            color: rgba(246, 237, 255, 0.55);
            display: flex;
            align-items: center;
            gap: 6px;
            line-height: 1.2;
        }
    
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #39ffb0;
            box-shadow: 0 0 8px rgba(57, 255, 176, 0.7);
            flex-shrink: 0;
        }
    
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
            flex-shrink: 0;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
    
        #user-info {
            font-size: 0.82rem;
            color: var(--text-muted);
            text-align: right;
            line-height: 1.25;
        }
    
        #subscription-status,
        .tier-badge {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(195, 0, 255, 0.15);
            border: 1px solid rgba(195, 0, 255, 0.45);
            color: #e8c6ff;
            white-space: nowrap;
            cursor: pointer;
        }
    
        #usage-counter {
            font-size: 0.78rem;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(195, 0, 255, 0.12);
            border: 1px solid rgba(195, 0, 255, 0.35);
            color: #f8f0ff;
            white-space: nowrap;
        }
    
        .btn-upgrade {
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 650;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border: none;
            border-radius: 999px;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(195, 0, 255, 0.35);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .btn-upgrade:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 22px rgba(255, 0, 153, 0.4);
        }
    
        .btn-logout {
            padding: 6px 12px;
            font-size: 0.82rem;
            background: rgba(255, 100, 100, 0.15);
            border: 1px solid rgba(255, 100, 100, 0.55);
            border-radius: 999px;
            color: #ffd0d0;
            cursor: pointer;
        }
        .btn-logout:hover {
            background: rgba(255, 100, 100, 0.25);
            color: white;
        }
    
        /* ========== LAYOUT ========== */
        #auth-screen, #chat-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
    
        #auth-screen {
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
        }
    
        .auth-card {
            width: 100%;
            max-width: 400px;
            background: rgba(24, 12, 45, 0.9);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 32px 28px;
            box-shadow: var(--shadow), 0 0 60px rgba(195, 0, 255, 0.12);
            backdrop-filter: blur(12px);
        }
    
        .auth-card h2 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            text-align: center;
            background: linear-gradient(135deg, #fff, #e0b3ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    
        .auth-card input {
            width: 100%;
            margin: 8px 0;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(195, 0, 255, 0.25);
            background: rgba(0, 0, 0, 0.28);
            color: var(--text);
            outline: none;
            font-size: 0.95rem;
        }
        .auth-card input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(195, 0, 255, 0.15);
        }
    
        .auth-card button,
        .btn-primary {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            font-weight: 650;
            cursor: pointer;
            font-size: 0.95rem;
        }
    
        /* ========== MESSAGES ========== */
        #messages,
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
            scroll-behavior: smooth;
        }
    
        #messages::-webkit-scrollbar { width: 6px; }
        #messages::-webkit-scrollbar-thumb {
            background: rgba(195, 0, 255, 0.35);
            border-radius: 99px;
        }
    
        .message {
            max-width: min(78%, 480px);
            padding: 10px 14px;
            border-radius: var(--radius);
            line-height: 1.42;
            font-size: 0.94rem;
            word-wrap: break-word;
            animation: msgIn 0.2s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
        }
    
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    
        .message.received {
            align-self: flex-start;
            background: var(--bg-bubble-her);
            border: 1px solid rgba(195, 0, 255, 0.16);
            border-bottom-left-radius: 5px;
            color: var(--text);
        }
    
        .message.sent {
            align-self: flex-end;
            background: var(--bg-bubble-him);
            color: white;
            border-bottom-right-radius: 5px;
            box-shadow: 0 6px 20px rgba(195, 0, 255, 0.28);
        }
    
        /* ========== CUSTOM VOICE CARDS ========== */
        .message.voice-only,
        .message.voice-card {
            align-self: flex-start;
            min-width: 220px;
            max-width: 280px;
            background: linear-gradient(165deg, rgba(70, 30, 120, 0.95), rgba(28, 12, 55, 0.96));
            border: 1px solid rgba(195, 0, 255, 0.4);
            border-bottom-left-radius: 5px;
            padding: 12px 14px !important;
            box-shadow: 0 6px 20px rgba(80, 0, 140, 0.25);
        }
    
        .voice-top {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
            font-size: 0.78rem;
            color: #e0b8ff;
            font-weight: 600;
        }
        .voice-time {
            margin-left: auto;
            color: rgba(246, 237, 255, 0.5);
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }
        .voice-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .voice-play {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #c300ff, #ff0099);
            color: white;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 2px 12px rgba(195, 0, 255, 0.45);
        }
        .voice-play:hover { transform: scale(1.05); }
        .voice-track {
            flex: 1;
            height: 5px;
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.12);
            overflow: hidden;
        }
        .voice-fill {
            height: 100%;
            width: 0%;
            border-radius: 99px;
            background: linear-gradient(90deg, #c300ff, #ff0099);
            transition: width 0.1s linear;
        }
    
        /* Hide native audio if any leftover */
        .message.voice-only audio,
        .message.voice-card audio {
            display: none;
        }
    
        /* Typing */
        #typing-container,
        .typing {
            padding: 4px 16px 8px;
            color: var(--text-muted);
            font-size: 0.85rem;
            min-height: 22px;
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
        }
    
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #c300ff;
            animation: blink 1.2s infinite ease-in-out;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.15s; }
        .typing-dot:nth-child(3) { animation-delay: 0.3s; }
        @keyframes blink {
            0%, 80%, 100% { opacity: 0.25; transform: scale(0.9); }
            40% { opacity: 1; transform: scale(1); }
        }
    
        /* ========== INPUT BAR ========== */
        .input-area,
        #input-area {
            flex-shrink: 0;
            padding: 12px 14px 16px;
            background: rgba(10, 3, 20, 0.78);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: center;
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
        }
    
        #user-input,
        .input-area input,
        .input-area textarea {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(195, 0, 255, 0.22);
            color: var(--text);
            border-radius: 999px;
            padding: 13px 18px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        #user-input:focus {
            border-color: rgba(195, 0, 255, 0.65);
            box-shadow: 0 0 0 3px rgba(195, 0, 255, 0.14);
        }
        #user-input::placeholder {
            color: rgba(246, 237, 255, 0.35);
        }
    
        #send-btn,
        .send-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 18px rgba(195, 0, 255, 0.4);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
            flex-shrink: 0;
        }
        #send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 24px rgba(255, 0, 153, 0.45);
        }
        #send-btn:disabled {
            opacity: 0.45;
            transform: none;
            cursor: not-allowed;
        }
    
        #offline-message {
            text-align: center;
            padding: 16px;
            color: #ff9ccf;
            font-size: 0.9rem;
            display: none;
        }
    
        /* ========== MODALS ========== */
        .modal-overlay,
        #pricing-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(6px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
    
        .modal-card {
            background: rgba(24, 12, 45, 0.96);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 28px 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 50px rgba(195, 0, 255, 0.15);
            text-align: center;
        }
    
        /* ========== MOBILE ========== */
        @media (max-width: 520px) {
            .message { max-width: 88%; font-size: 0.92rem; }
            .header { padding: 10px 12px; }
            #user-info { display: none; }
            .auth-card { padding: 26px 20px; }
            .header-actions { gap: 6px; }
            .btn-upgrade { padding: 7px 11px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <!-- Auth Screen -->
    <div id="auth-screen">
        <div class="auth-card">
            <h2 class="text-center text-2xl mb-6">Welcome to Aurora Sparq</h2>
            
            <div id="login-form">
                <input id="login-email" type="email" placeholder="Email" />
                <input id="login-password" type="password" placeholder="Password" />
                <button class="btn-primary" onclick="login()">Login</button>
                <p class="text-center text-sm mt-4">
                    No account? <span onclick="showRegister()" style="color:var(--accent); cursor:pointer;">Register</span>
                </p>
            </div>

            <div id="register-form" style="display:none;">
                <input id="reg-fullname" type="text" placeholder="Full Name" />
                <input id="reg-email" type="email" placeholder="Email" />
                <input id="reg-password" type="password" placeholder="Password" />
                <button class="btn-primary" onclick="register()">Create Account</button>
                <p class="text-center text-sm mt-4">
                    Already have an account? <span onclick="showLogin()" style="color:var(--accent); cursor:pointer;">Login</span>
                </p>
            </div>
        </div>
    </div>

    <!-- Chat Screen -->
    <div id="chat-wrapper" style="display: none;">
        <div class="header">
            <div class="avatar"></div>
            <div class="header-info">
                <div class="header-name">Isabella</div>
                <div class="header-status"><span class="status-dot"></span> Online · Queens, NY</div>
            </div>
        
            <div class="header-actions">
                <div id="user-info"></div>
                <div id="usage-counter"></div>
                <div id="subscription-status" style="display:none;" onclick="showPricingModal()">
                    <span id="current-tier"></span>
                </div>
                <button id="upgrade-btn" class="btn-upgrade" onclick="showPricingModal()">Upgrade</button>
                <button class="btn-logout" onclick="logout()">Log Out</button>
            </div>
        </div>
    </div>
        
        <div id="messages"></div>

        <div id="offline-message">
            <h3>🌙 Isabella is Offline</h3>
            <p>Only available between <strong>5:00 PM - 2:00 AM ET</strong></p>
            <p style="margin-top: 8px; opacity: 0.8;">Come back during those hours ✨</p>
        </div>

        <div id="typing-container" style="display:none; padding:8px 16px;">
            <div class="typing-indicator">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <span>Isabella is typing...</span>
            </div>
        </div>

        <div class="input-area" style="padding:12px 16px; display:flex; gap:10px;">
            <input id="user-input" placeholder="Message Isabella..." autocomplete="off" />
            <button id="send-btn" style="width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;border:none;font-size:20px;cursor:pointer;">➤</button>
        </div>
    </div>

    <!-- Pricing Modal -->
    <div id="pricing-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; align-items: center; justify-content: center;">
        <div style="background: #1a0033; padding: 40px 30px; border-radius: 24px; border: 3px solid #c300ff; max-width: 420px; text-align: center; box-shadow: 0 0 60px rgba(195,0,255,0.6);">
            <h2 style="color: #c300ff; margin-bottom: 30px;">Choose Your Experience</h2>
           
            <button onclick="upgradePlan('premium_monthly')"
                    style="width: 100%; padding: 20px; margin: 12px 0; background: #6b00b3; border: none; border-radius: 16px; color: white; font-size: 1.15rem; cursor: pointer;">
                <strong>Premium — $14.99/mo</strong><br>
                <small style="opacity: 0.9;">Unlimited messages • Voice Notes • Better Memory</small>
            </button>
           
            <button onclick="hidePricingModal()"
                    style="margin-top: 25px; background: transparent; border: 1px solid #666; color: #ccc; padding: 12px 50px; border-radius: 50px; cursor: pointer;">
                Maybe Later
            </button>
        </div>
    </div>
   <script>
        let token = localStorage.getItem('token');
        let currentUser = null;
        let convoId = null;

        const messagesContainer = document.getElementById('messages');
        const typingContainer = document.getElementById('typing-container');
        const input = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const authScreen = document.getElementById('auth-screen');
        const chatWrapper = document.getElementById('chat-wrapper');
        const userInfo = document.getElementById('user-info');
        const offlineMessage = document.getElementById('offline-message');

        let isSending = false;
        let pendingMessages = [];
        let debounceTimer = null;
        let readingTimer = null;
        let isProcessingQueue = false;
        let phase = 'idle'; // idle | waiting | reading | processing

        // Timing
        const READING_DELAY_MS = 5000;
        const TYPING_DELAY_MS = 1800;
        const BETWEEN_BUBBLES_MS = 1200;
        const USER_DONE_MS = 1800;
        const BETWEEN_VOICE_MS = 600;

        // ==================== AVAILABILITY ====================
        function isIsabellaAvailable() {
            return true;
        }

        function updateAvailability() {
            offlineMessage.style.display = 'none';
            chatWrapper.style.opacity = '1';
            if (input) input.disabled = false;
            if (sendBtn) sendBtn.disabled = false;
        }

        // ==================== AUTH ====================
        async function authFetch(url, options = {}) {
            const res = await fetch(url, {
                ...options,
                headers: {
                    ...(options.headers || {}),
                    'Authorization': `Bearer ${token}`
                }
            });

            if (res.status === 401) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                alert("Your session has expired. Please log in again.");
                window.location.reload();
                return null;
            }
            return res;
        }

        function showLogin() {
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('register-form').style.display = 'none';
        }

        function showRegister() {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('register-form').style.display = 'block';
        }

        async function register() {
            const fullName = document.getElementById('reg-fullname').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value.trim();
            if (!email || !password) return alert("Email and password required");

            try {
                const res = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, full_name: fullName })
                });
                const data = await res.json();

                if (res.ok) {
                    document.getElementById('register-form').style.display = 'none';
                    document.getElementById('login-form').style.display = 'none';
                    const authCard = document.querySelector('.auth-card');

                    authCard.innerHTML = `
                        <div style="text-align: center; padding: 30px 10px;">
                            <div style="font-size: 60px; margin-bottom: 15px;">✅</div>
                            <h2 style="color:#c300ff; margin-bottom:10px; font-size:1.6rem;">Account Created!</h2>
                            <p style="color:#e0d4ff; font-size:1.05rem;">You're all set, ${fullName.split(" ")[0]}.</p>
                        </div>
                    `;

                    setTimeout(() => {
                        authCard.innerHTML = `
                            <div style="text-align: center; padding: 10px 0;">
                                <h2 style="color:#c300ff; margin-bottom:12px; font-size:1.85rem;">Welcome, ${fullName.split(" ")[0]}!</h2>
                                <p style="margin-bottom:24px; line-height:1.6; color:#e0d4ff; font-size:1.05rem;">
                                    Want the <strong>best experience</strong> with Isabella?
                                </p>
                                <div style="background: rgba(107, 0, 179, 0.12); border: 1px solid #6b00b3; border-radius: 16px; padding: 18px 20px; margin-bottom: 26px; text-align: left;">
                                    <div style="color:#c300ff; font-weight:600; margin-bottom:10px; font-size:1rem;">Premium includes:</div>
                                    <ul style="margin:0; padding-left:18px; color:#e0d4ff; line-height:1.75; font-size:0.95rem;">
                                        <li>Unlimited messages with Isabella</li>
                                        <li>Voice notes from her</li>
                                        <li>Smarter memory &amp; better conversations</li>
                                        <li>Priority access</li>
                                    </ul>
                                </div>
                                <button id="post-reg-upgrade-btn"
                                        style="width:100%; padding:18px 20px; background: linear-gradient(135deg, #6b00b3, #c300ff); border:none; border-radius:16px; color:white; font-size:1.1rem; font-weight:600; margin-bottom:14px; cursor:pointer; box-shadow: 0 4px 20px rgba(195, 0, 255, 0.5);">
                                    Yes, Upgrade to Premium — $14.99/mo
                                </button>
                                <button id="skip-btn"
                                        style="width:100%; padding:13px 20px; background:transparent; border:1px solid #555; color:#aaa; border-radius:50px; cursor:pointer; font-size:0.95rem;">
                                    No thanks, continue with Free
                                </button>
                            </div>
                        `;

                        const upgradeBtn = document.getElementById('post-reg-upgrade-btn');
                        const skipBtn = document.getElementById('skip-btn');

                        upgradeBtn.onclick = async () => {
                            upgradeBtn.disabled = true;
                            upgradeBtn.style.opacity = '0.7';
                            upgradeBtn.innerHTML = 'Processing... Please wait';
                            await upgradeAfterRegister(email, password);
                        };

                        skipBtn.onclick = () => {
                            skipBtn.disabled = true;
                            skipBtn.style.opacity = '0.6';
                            skipBtn.innerHTML = 'Continuing with Free...';
                            setTimeout(() => showLoginAfterRegister(), 500);
                        };
                    }, 1400);
                } else {
                    alert(data.detail || "Registration failed");
                }
            } catch (e) {
                alert("Error during registration");
            }
        }

        async function upgradeAfterRegister(email, password) {
            try {
                const formData = new FormData();
                formData.append('username', email);
                formData.append('password', password);

                const loginRes = await fetch('/auth/login', { method: 'POST', body: formData });
                const loginData = await loginRes.json();

                if (!loginRes.ok) {
                    alert("Something went wrong during auto-login. Please try logging in manually.");
                    showLogin();
                    return;
                }

                token = loginData.access_token;
                currentUser = loginData.user;
                localStorage.setItem('token', token);
                localStorage.setItem('user', JSON.stringify(currentUser));
                convoId = `user_${currentUser.id}`;
                localStorage.setItem('convo_id', convoId);

                await upgradePlan('premium_monthly');
            } catch (error) {
                console.error(error);
                alert("Something went wrong. Please try logging in and upgrading manually.");
                showLogin();
            }
        }

        function showLoginAfterRegister() {
            showLogin();
            alert("Account created! You can upgrade to Premium anytime from the Upgrade button.");
        }

        async function login() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();
            if (!email || !password) {
                alert("Please enter email and password");
                return;
            }

            try {
                const formData = new FormData();
                formData.append('username', email);
                formData.append('password', password);

                const res = await fetch('/auth/login', { method: 'POST', body: formData });
                const data = await res.json();

                if (res.ok) {
                    token = data.access_token;
                    currentUser = data.user;
                    localStorage.setItem('token', token);
                    localStorage.setItem('user', JSON.stringify(currentUser));
                    convoId = `user_${currentUser.id}`;
                    localStorage.setItem('convo_id', convoId);

                    authScreen.style.display = 'none';
                    chatWrapper.style.display = 'flex';
                    if (userInfo) {
                        userInfo.textContent = `Hi, ${currentUser.full_name || currentUser.email}`;
                    }

                    updateSubscriptionDisplay();
                    await loadUserHistory();
                    updateAvailability();
                    await updateUsageCounter();
                    await refreshUserData();
                } else {
                    alert(data.detail || "Login failed. Please check your credentials.");
                }
            } catch (e) {
                console.error("Login error:", e);
                alert("Login error. Please try again.");
            }
        }

        async function refreshUserData() {
            if (!token) return;
            try {
                const res = await authFetch('/auth/me');
                if (!res) return;

                const freshUser = await res.json();
                currentUser = freshUser;
                localStorage.setItem('user', JSON.stringify(freshUser));

                if (currentUser && currentUser.id) {
                    convoId = `user_${currentUser.id}`;
                    localStorage.setItem('convo_id', convoId);
                }

                if (userInfo) {
                    userInfo.textContent = `Hi, ${currentUser.full_name || currentUser.email || 'User'}`;
                }

                // Keep header in sync with real tier
                updateSubscriptionDisplay();
                await updateUsageCounter();

                console.log("✅ User data refreshed - Tier:", freshUser.subscription_tier);
            } catch (e) {
                console.error("Failed to refresh user data", e);
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            localStorage.removeItem('convo_id');
            window.location.reload();
        }

        // ==================== CHAT CORE ====================
        function parseVoiceContent(content) {
            if (!content || !content.startsWith('[voice_note]|')) return null;
            const parts = content.split('|');
            if (parts.length < 2) return null;
            return {
                url: parts[1].trim(),
                label: (parts[2] || 'Voice note').trim()
            };
        }

        async function loadUserHistory() {
            if (!token || !currentUser) return;

            convoId = `user_${currentUser.id}`;
            localStorage.setItem('convo_id', convoId);

            try {
                const res = await authFetch('/api/history');
                if (!res) return;

                const data = await res.json();
                messagesContainer.innerHTML = '';

                if (data.messages && data.messages.length > 0) {
                    data.messages.forEach(m => {
                        const content = (m.content || "").trim();
                        if (!content) return;

                        const voice = parseVoiceContent(content);
                        if (voice && m.role === 'assistant') {
                            addVoiceMessageOnly(voice.url, voice.label);
                            return;
                        }

                        // Skip legacy dumped voice scripts
                        if (m.role === 'assistant' && content.toLowerCase().startsWith('[voice note]')) {
                            return;
                        }

                        const type = m.role === 'user' ? 'sent' : 'received';
                        addMessage(content, type);
                    });
                }
                scrollToBottom();
            } catch (e) {
                console.error("Failed to load history", e);
            }
        }

        function addMessage(text, type) {
            const content = (text || "").trim();
            if (!content) return;
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = content;
            messagesContainer.appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showTyping() {
            typingContainer.innerHTML = `
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <span>Isabella is typing...</span>
                </div>
            `;
            typingContainer.style.display = 'block';
            scrollToBottom();
        }

        function hideTyping() {
            typingContainer.style.display = 'none';
            typingContainer.innerHTML = '';
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function addVoiceMessageOnly(voiceUrl, label = 'Voice note') {
            if (!voiceUrl) return;

            const div = document.createElement('div');
            div.className = 'message received voice-card';

            const audio = new Audio(voiceUrl);
            audio.preload = 'metadata';

            let playing = false;

            div.innerHTML = `
                <div class="voice-top">
                    <span class="voice-icon">🎙️</span>
                    <span class="voice-label">${label}</span>
                    <span class="voice-time">0:00</span>
                </div>
                <div class="voice-row">
                    <button type="button" class="voice-play" aria-label="Play">▶</button>
                    <div class="voice-track"><div class="voice-fill"></div></div>
                </div>
            `;

            const playBtn = div.querySelector('.voice-play');
            const fill = div.querySelector('.voice-fill');
            const timeEl = div.querySelector('.voice-time');

            function fmt(s) {
                if (!isFinite(s)) return '0:00';
                const m = Math.floor(s / 60);
                const sec = Math.floor(s % 60);
                return m + ':' + String(sec).padStart(2, '0');
            }

            playBtn.addEventListener('click', () => {
                if (playing) {
                    audio.pause();
                } else {
                    // Pause any other playing voice notes
                    document.querySelectorAll('.voice-card audio').forEach(a => {
                        if (a !== audio) a.pause();
                    });
                    audio.play().catch(() => {});
                }
            });

            audio.addEventListener('play', () => {
                playing = true;
                playBtn.textContent = '❚❚';
            });
            audio.addEventListener('pause', () => {
                playing = false;
                playBtn.textContent = '▶';
            });
            audio.addEventListener('ended', () => {
                playing = false;
                playBtn.textContent = '▶';
                fill.style.width = '0%';
            });
            audio.addEventListener('timeupdate', () => {
                if (audio.duration) {
                    fill.style.width = (100 * audio.currentTime / audio.duration) + '%';
                    timeEl.textContent = fmt(audio.currentTime);
                }
            });
            audio.addEventListener('loadedmetadata', () => {
                timeEl.textContent = fmt(audio.duration);
            });

            audio.style.display = 'none';
            div.appendChild(audio);

            messagesContainer.appendChild(div);
            scrollToBottom();
        }

        function getVoiceUrlsFromResponse(data) {
            if (!data) return [];
            if (Array.isArray(data.voice_notes) && data.voice_notes.length > 0) {
                return data.voice_notes.filter(Boolean);
            }
            if (data.voice_message && data.voice_message.voice_url) {
                return [data.voice_message.voice_url];
            }
            if (data.voice_url) {
                return [data.voice_url];
            }
            return [];
        }

        async function playVoiceNotes(urls) {
            for (let i = 0; i < urls.length; i++) {
                if (i > 0) await sleep(BETWEEN_VOICE_MS);
                addVoiceMessageOnly(urls[i]);
            }
        }

        // ==================== MESSAGE QUEUE + DELAYS ====================
        function cancelReading() {
            if (readingTimer) {
                clearTimeout(readingTimer);
                readingTimer = null;
            }
            if (phase === 'reading') {
                phase = 'waiting';
            }
        }

        function sendMessage() {
            const msg = input.value.trim();
            if (!msg) return;
            if (phase === 'processing') return;

            cancelReading();
            addMessage(msg, 'sent');
            input.value = '';
            pendingMessages.push(msg);
            phase = 'waiting';

            if (debounceTimer) clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                startReadingPhase();
            }, USER_DONE_MS);
        }

        function startReadingPhase() {
            if (pendingMessages.length === 0) {
                phase = 'idle';
                return;
            }
            if (phase === 'processing') return;

            phase = 'reading';
            readingTimer = setTimeout(() => {
                readingTimer = null;
                if (phase === 'reading' && pendingMessages.length > 0) {
                    processMessageQueue();
                }
            }, READING_DELAY_MS);
        }

        async function processMessageQueue() {
            if (isProcessingQueue || pendingMessages.length === 0) return;

            isProcessingQueue = true;
            phase = 'processing';

            const messagesToSend = [...pendingMessages];
            pendingMessages = [];
            const combinedMessage = messagesToSend.join('\n');

            showTyping();
            await sleep(TYPING_DELAY_MS);

            try {
                const res = await fetch('/api/reply', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        convo_id: convoId,
                        message: combinedMessage
                    })
                });

                const data = await res.json();
                hideTyping();

                if (data.replies && Array.isArray(data.replies)) {
                    const cleanReplies = data.replies
                        .map(b => (b || "").trim())
                        .filter(b => b.length > 0);

                    for (let i = 0; i < cleanReplies.length; i++) {
                        if (i > 0) {
                            showTyping();
                            await sleep(BETWEEN_BUBBLES_MS);
                            hideTyping();
                        }
                        addMessage(cleanReplies[i], 'received');
                    }
                }

                const voiceUrls = getVoiceUrlsFromResponse(data);
                if (voiceUrls.length > 0) {
                    await playVoiceNotes(voiceUrls);
                }
            } catch (err) {
                console.error("Send error:", err);
                hideTyping();
            } finally {
                isProcessingQueue = false;
                phase = 'idle';
                await updateUsageCounter();

                if (pendingMessages.length > 0) {
                    phase = 'waiting';
                    if (debounceTimer) clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(() => startReadingPhase(), USER_DONE_MS);
                }
            }
        }

        // ==================== PAYMENTS & USAGE ====================
        function showPricingModal() {
            const modal = document.getElementById('pricing-modal');
            if (modal) modal.style.display = 'flex';
        }

        function hidePricingModal() {
            const modal = document.getElementById('pricing-modal');
            if (modal) modal.style.display = 'none';
        }

        async function upgradePlan(priceType) {
            if (!token) {
                alert("Please login first");
                return;
            }
            try {
                const res = await authFetch('/payments/create-checkout-session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ price_type: priceType })
                });
                if (!res) return;

                const data = await res.json();
                if (data.url) {
                    window.location.href = data.url;
                } else {
                    alert(data.detail || "Payment error");
                }
            } catch (error) {
                alert("Payment error. Please try again.");
            }
        }

        function updateSubscriptionDisplay() {
            if (!currentUser) return;

            const statusEl = document.getElementById('subscription-status');
            const tierEl = document.getElementById('current-tier');
            // Support both id and class so header markup can't miss
            const upgradeBtn =
                document.getElementById('upgrade-btn') ||
                document.querySelector('.btn-upgrade');

            const tier = (currentUser.subscription_tier || 'free').toLowerCase();

            if (tier === 'premium') {
                if (tierEl) tierEl.textContent = 'PREMIUM PLAN';
                if (statusEl) statusEl.style.display = 'block';
                if (upgradeBtn) upgradeBtn.style.display = 'none';
            } else {
                if (statusEl) statusEl.style.display = 'none';
                if (upgradeBtn) upgradeBtn.style.display = '';
            }
        }

        async function updateUsageCounter() {
            const counterEl = document.getElementById('usage-counter');
            if (!counterEl || !currentUser || !token) return;

            try {
                const res = await authFetch('/api/usage');
                if (!res) return;

                if (!res.ok) {
                    counterEl.innerHTML = '—';
                    return;
                }

                const data = await res.json();
                const tier = (currentUser.subscription_tier || 'free').toLowerCase();

                if (tier === 'premium') {
                    counterEl.innerHTML = 'Unlimited ✨';
                    counterEl.style.background = 'rgba(0, 200, 100, 0.15)';
                    counterEl.style.border = '1px solid #00c864';
                } else {
                    const remaining = Math.max(0, 10 - (data.daily_count || 0));
                    counterEl.innerHTML = `${remaining} / 10 today`;

                    if (remaining < 5) {
                        counterEl.style.background = 'rgba(255, 100, 100, 0.2)';
                        counterEl.style.border = '1px solid #ff6464';
                    } else {
                        counterEl.style.background = 'rgba(195,0,255,0.15)';
                        counterEl.style.border = '1px solid var(--accent)';
                    }
                }
            } catch (e) {
                counterEl.innerHTML = '—';
            }
        }

        // ==================== INIT ====================
        window.addEventListener('load', () => {
            if (token) {
                currentUser = JSON.parse(localStorage.getItem('user') || '{}');
                authScreen.style.display = 'none';
                chatWrapper.style.display = 'flex';

                if (userInfo) {
                    userInfo.textContent = `Hi, ${currentUser.full_name || currentUser.email || 'User'}`;
                }

                if (currentUser && currentUser.id) {
                    convoId = `user_${currentUser.id}`;
                    localStorage.setItem('convo_id', convoId);
                }

                // Show cached tier immediately, then refresh from server
                updateSubscriptionDisplay();
                updateUsageCounter();
                loadUserHistory();
                refreshUserData();
            }
            updateAvailability();
        });

        // ==================== EVENT LISTENERS ====================
        if (input) {
            input.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendMessage();
                }
            });
            input.addEventListener('input', function () {
                if (phase === 'reading') {
                    cancelReading();
                    phase = 'waiting';
                }
            });
        }

        if (sendBtn) {
            sendBtn.addEventListener('click', sendMessage);
        }
    </script>
</body>
</html>
